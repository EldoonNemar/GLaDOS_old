[project]
name = "glados-spoke"
version = "0.1.0"
description = "GLaDOS Spoke Client — lightweight endpoint for hub-and-spoke deployments"
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.4.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "scipy>=1.10.0",
    "speexdsp>=0.1.1",
    "pygame>=2.5.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
glados-spoke = "glados_spoke.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
# GLaDOS Hub — orchestrates spokes on your ROCm server
#
# Prerequisites:
#   - llama.cpp running as `glados_llama` with Gemma 4 E4B (port 18080)
#   - Docker Compose v2
#
# Spoke devices connect to this hub via WebSocket on port 5051.
# The hub talks to llama.cpp at port 8080 (the `glados_llama` container).

services:
  glados_llama:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: glados_llama
    restart: unless-stopped
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - video
      - render
    ports:
      - "18080:8080"
    volumes:
      - ./models:/models
    environment:
      - HIP_VISIBLE_DEVICES=0,1
      - GGML_CUDA_P2P=1
    command:
      - "-m"
      - "/models/gemma-4-E4B-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "65536"
      - "--parallel"
      - "4"
      - "--ctx-offset"
      - "16384"
      - "-ngl"
      - "99"
    networks:
      - glados
      - jigowatts_default

  hub:
    build:
      context: .
      dockerfile: docker/hub.Dockerfile
    image: glados-hub:latest
    container_name: glados_hub
    restart: unless-stopped
    ports:
      - "5051:5051"   # WebSocket audio (mic + speaker)
    environment:
      # Point to your llama.cpp container
      - GLADOS_LLM_URL=http://glados_llama:8080/v1/chat/completions
      - GLADOS_LLM_MODEL=gemma-4-E4B
      # Enable native audio mode for lowest latency
      - GLADOS_NATIVE_AUDIO_ENABLED=false
      - GLADOS_NATIVE_AUDIO_USER_TRANSCRIPTS=false
      - GLADOS_NATIVE_AUDIO_LANGUAGE=English
      # WebSocket audio backend for spoke connections
      - GLADOS_AUDIO_IO=websocket
      - GLADOS_AUDIO_IO_OPTIONS_SERVER=0.0.0.0
      - GLADOS_AUDIO_IO_OPTIONS_PORT=5051
      # Echo detection config
      - GLADOS_ECHO_TEXT_SIMILARITY_THRESHOLD=0.7
      - GLADOS_ECHO_TEXT_MIN_LENGTH=4
      - GLADOS_ECHO_RECENT_TURNS=3
    volumes:
      # Mount host models directory (bind mount, not named volume)
      - ./models:/app/models
    networks:
      - glados
      - jigowatts_default

  tts:
    build:
      context: .
      dockerfile: docker/hub.Dockerfile
    image: glados-hub:latest
    container_name: glados_tts
    restart: unless-stopped
    ports:
      - "5050:5050"   # TTS API (OpenAI-compatible)
    command: ["/usr/local/bin/uv", "run", "litestar", "--app", "glados.api.app:create_app", "run", "--host", "0.0.0.0", "--port", "5050"]
    environment:
      - GLADOS_LLM_URL=http://glados_llama:8080/v1/chat/completions
      - GLADOS_LLM_MODEL=gemma-4-E4B
    volumes:
      # Mount host models directory
      - ./models:/app/models
    networks:
      - glados

networks:
  glados:
    driver: bridge
  jigowatts_default:
    external: true
